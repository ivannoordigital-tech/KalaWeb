    <text x="140" y="33" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#B3471E" text-anchor="middle">✓ Minyak Food-Grade Steril</text>
  </g>

  <g transform="translate(680, 480)">
    <rect width="320" height="54" rx="27" fill="#FFEFE5" stroke="#F6DCCD"/>
    <text x="160" y="33" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#B3471E" text-anchor="middle">✓ 100% Homecare ke Rumah</text>
