    <text x="130" y="33" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#B3471E" text-anchor="middle">✓ Bidan Ber-STR Resmi</text>
  </g>

  <g transform="translate(380, 480)">
