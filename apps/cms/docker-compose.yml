version: '3.8'

services:
  cms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kala-cms-app
    restart: unless-stopped
    environment:
      - DATABASE_URI=postgresql://kala_cms_user:${CMS_DB_PASSWORD}@postgres:5432/kala_cms_db
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - NEXT_PUBLIC_SERVER_URL=https://admin.kalababyspa.com
      - NODE_ENV=production
    volumes:
      - cms_media:/app/public/media
    networks:
      - wa-clinic-bot_default
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  cms_media:

networks:
  wa-clinic-bot_default:
    external: true
