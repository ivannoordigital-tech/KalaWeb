<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#FFF9F4"/>
  <!-- Decorative Background Curves -->
  <circle cx="1050" cy="150" r="320" fill="#FFEFE5" opacity="0.8"/>
  <circle cx="150" cy="550" r="280" fill="#FFD9C4" opacity="0.5"/>

  <!-- Official Logo -->
  <g transform="translate(100, 80)">
    <image href="data:image/png;base64," width="120" height="120" />
    <g transform="translate(140, 25)">
      <text x="0" y="45" font-family="'Fredoka', 'Nunito', 'Segoe UI', sans-serif" font-size="44" font-weight="700" fill="#4B2E22">Kala</text>
      <text x="2" y="72" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#B3471E" letter-spacing="2">MOMS &amp; BABY SPA</text>
    </g>
  </g>

  <!-- Title & Tagline -->
  <text x="100" y="275" font-family="'Fredoka', 'Segoe UI', sans-serif" font-size="52" font-weight="700" fill="#4B2E22">Layanan Perawatan Ibu &amp; Bayi di Rumah</text>
  <text x="100" y="340" font-family="'Fredoka', 'Segoe UI', sans-serif" font-size="44" font-weight="700" fill="#B3471E">oleh Bidan Profesional di Surabaya &amp; Sidoarjo</text>

  <text x="100" y="415" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="24" font-weight="600" fill="#86675A">Tumbuh Berkembang Bersama Kala — Bidan Sahabat Bunda</text>

  <!-- Badges -->
  <g transform="translate(100, 480)">
