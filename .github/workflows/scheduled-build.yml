name: Scheduled Rebuild (Daily Cron)

on:
  schedule:
    # Runs daily at 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages Deploy Hook
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}" ]; then
            echo "Triggering Cloudflare build for scheduled content & promo expiration..."
            curl -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}"
          else
            echo "CLOUDFLARE_DEPLOY_HOOK_URL secret not set. Skipping scheduled build."
          fi
